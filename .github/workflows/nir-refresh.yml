name: Prepare reviewed NIR data update

on:
  workflow_dispatch:
    inputs:
      rehearse:
        description: Verify the workflow using existing data (no API extraction or review branch)
        type: boolean
        default: true
  schedule:
    # 02:23 Philippine time. Full extraction, not a per-visitor API request.
    - cron: '23 18 * * *'

permissions:
  contents: read

concurrency:
  group: nir-snapshot-refresh
  cancel-in-progress: false

jobs:
  candidate:
    permissions:
      contents: write
    # Daily extraction is opt-in. Candidates never merge themselves into main.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_NIR_REFRESH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify application against its checked-in reference snapshot
        run: npm test
      - run: npm run lint
      - name: Extract, reconcile and triage an isolated candidate
        env:
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          if [ "$REHEARSE" = "true" ]; then
            npm run data:refresh:candidate -- --rehearse
          else
            npm run data:refresh:candidate
          fi
      - name: Assemble candidate in this disposable CI checkout
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('release/nir-refresh/latest.json'));
          fs.cpSync(c.directory+'/public/data','public/data',{recursive:true});
          JS
      - name: Refresh the supporting hearing index only during a real extraction
        if: inputs.rehearse != true
        run: npm run data:hearings
      - name: Run all release checks on the assembled candidate
        run: npm run verify
      - name: Prepare a review branch (never merge or deploy it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/data-ingestion/review-branch.mjs
      - name: Save validated site candidate for the chosen host
        uses: actions/upload-artifact@v7
        with:
          name: nir-site-candidate-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Save refresh review report
        uses: actions/upload-artifact@v7
        with:
          name: nir-refresh-report-${{ github.run_id }}
          path: |
            release/nir-refresh/latest.json
            release/nir-refresh/*/candidate.json
            release/nir-refresh/*/docs/qa/premium-ui/privacy-source-triage.json
          if-no-files-found: error
          retention-days: 7
